@if (url(); as src) {
  @if (!errored()) {
    <img class="user-avatar__img" [src]="src" alt="" (error)="onError()" />
  } @else {
    <ng-container *ngTemplateOutlet="fallback" />
  }
} @else {
  <ng-container *ngTemplateOutlet="fallback" />
}

<ng-template #fallback>
  <svg
    class="user-avatar__fallback"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="12" cy="8" r="4" />
    <path d="M4 21v-1a8 8 0 0 1 16 0v1" />
  </svg>
</ng-template>
