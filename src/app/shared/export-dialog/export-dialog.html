<dialog ocDialog class="export-dialog" [attr.aria-labelledby]="titleId">
  <div class="export-dialog__inner">
    <header class="export-dialog__head">
      <h2 [id]="titleId" class="export-dialog__title">
        {{ 'courseExport.title' | transloco }}
      </h2>
      <button
        type="button"
        class="export-dialog__close"
        [attr.aria-label]="'courseExport.close' | transloco"
        (click)="close()"
      >
        ×
      </button>
    </header>

    <div class="export-dialog__body">
      <fieldset class="export-dialog__formats">
        <legend class="export-dialog__legend">{{ 'courseExport.format' | transloco }}</legend>

        <label class="export-dialog__choice">
          <input
            type="radio"
            [name]="fieldName"
            value="pdf"
            [checked]="format() === 'pdf'"
            (change)="format.set('pdf')"
          />
          <span class="export-dialog__choice-text">
            <span class="export-dialog__choice-label">{{ 'courseExport.pdf' | transloco }}</span>
            <span class="export-dialog__hint">{{ 'courseExport.pdfHint' | transloco }}</span>
          </span>
        </label>

        <label class="export-dialog__choice">
          <input
            type="radio"
            [name]="fieldName"
            value="html"
            [checked]="format() === 'html'"
            (change)="format.set('html')"
          />
          <span class="export-dialog__choice-text">
            <span class="export-dialog__choice-label">{{ 'courseExport.html' | transloco }}</span>
            <span class="export-dialog__hint">{{ 'courseExport.htmlHint' | transloco }}</span>
          </span>
        </label>
      </fieldset>

      @if (format() === 'html') {
        <label class="export-dialog__option">
          <input
            type="checkbox"
            [checked]="includeModules()"
            (change)="includeModules.set(readChecked($event))"
          />
          <span class="export-dialog__choice-text">
            <span class="export-dialog__choice-label">
              {{ 'courseExport.includeModules' | transloco }}
            </span>
            <span class="export-dialog__hint">
              {{ 'courseExport.includeModulesHint' | transloco }}
            </span>
          </span>
        </label>
      }
    </div>

    <footer class="export-dialog__foot">
      @if (busy()) {
        <span class="export-dialog__status" role="status">
          {{ 'courseExport.preparing' | transloco }}
        </span>
      }
      <button type="button" class="btn btn--ghost" [disabled]="busy()" (click)="close()">
        {{ 'courseExport.cancel' | transloco }}
      </button>
      <button type="button" class="btn btn--primary" [disabled]="busy()" (click)="submit()">
        {{ 'courseExport.submit' | transloco }}
      </button>
    </footer>
  </div>
</dialog>
