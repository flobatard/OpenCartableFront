@if (isBrowser) {
  <iframe
    #frame
    class="module-runner__frame"
    sandbox="allow-scripts allow-forms allow-modals"
    referrerpolicy="no-referrer"
    loading="lazy"
    [style.height.px]="frameHeight()"
    [title]="title() || ('moduleEmbed.frameTitle' | transloco)"
  ></iframe>
  @if (libraryError()) {
    <p class="module-runner__error" role="status">
      {{ 'moduleEmbed.libraryError' | transloco }}
    </p>
  }
}
