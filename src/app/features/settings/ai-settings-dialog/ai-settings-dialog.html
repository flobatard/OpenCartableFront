<dialog
  ocDialog
  class="ai-settings-dialog"
  [attr.aria-labelledby]="uid + '-title'"
>
  <div class="ai-settings-dialog__inner">
    <header class="ai-settings-dialog__head">
      <h2 [id]="uid + '-title'" class="ai-settings-dialog__title">
        {{ 'courseChat.settingsDialog.title' | transloco }}
      </h2>
      <button
        type="button"
        class="ai-settings-dialog__close"
        [attr.aria-label]="'courseChat.settingsDialog.close' | transloco"
        (click)="close()"
      >
        ×
      </button>
    </header>

    <div class="ai-settings-dialog__body">
      @if (opened()) {
        <app-ai-settings [embedded]="true" />
      }
    </div>
  </div>
</dialog>
