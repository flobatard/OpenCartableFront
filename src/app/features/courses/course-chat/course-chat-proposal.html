<div class="chat-proposal" [class.chat-proposal--pending]="status() === 'running'">
  <div class="chat-proposal__head">
    <svg
      class="chat-proposal__icon"
      viewBox="0 0 24 24"
      width="16"
      height="16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
      <path d="m15 5 4 4" />
    </svg>
    <span class="chat-proposal__title">{{ 'courseChat.proposal.title' | transloco }}</span>
  </div>

  @if (summary(); as summary) {
    <p class="chat-proposal__summary">{{ summary }}</p>
  }

  @if (status() === 'running') {
    <p class="chat-proposal__pending" role="status">
      {{ 'courseChat.proposal.pendingHint' | transloco }}
    </p>
  } @else if (result(); as result) {
    <p class="chat-proposal__decision">{{ result }}</p>
  }
</div>
