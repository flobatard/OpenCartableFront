<div class="assistant-panel__card" [hidden]="!assistant.panelOpen()">
  <app-course-chat [courseId]="courseId()" (collapse)="assistant.setPanelOpen(false)" />
</div>

@if (!assistant.panelOpen()) {
  <button type="button" class="assistant-panel__pill" (click)="assistant.setPanelOpen(true)">
    <svg
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
    </svg>
    {{ 'courseChat.title' | transloco }}
  </button>
}
