@if (!blocks().length) {
  <p class="course-preview__empty">{{ 'courses.preview.empty' | transloco }}</p>
} @else {
  <div class="course-preview__toolbar">
    <button type="button" class="btn btn--secondary" (click)="openStyle()">
      {{ 'courseStyle.trigger' | transloco }}
    </button>
    <button type="button" class="btn btn--secondary" (click)="download()">
      {{ 'courses.preview.downloadPdf' | transloco }}
    </button>
  </div>
  <div #previewContent [style]="courseStyle.styleVars()">
    <app-course-blocks-view
      [blocks]="blocks()"
      [courseId]="courseId()"
      [resources]="resourceList()"
    />
  </div>
  <app-course-style-dialog />
}
