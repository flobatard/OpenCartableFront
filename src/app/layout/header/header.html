<header class="header">
  <!-- Logo : lockup horizontal, symbole seul sur téléphone (<source media>, sans JS). -->
  <a [routerLink]="['/', language.lang(), 'home']" class="header__brand">
    <picture class="header__logo header__logo--light">
      <source media="(max-width: 640px)" srcset="opencartable-symbol.svg" />
      <img src="opencartable-logo-horizontal.svg" alt="OpenCartable" height="32" />
    </picture>
    <picture class="header__logo header__logo--dark">
      <source media="(max-width: 640px)" srcset="opencartable-symbol-dark.svg" />
      <img src="opencartable-logo-horizontal-dark.svg" alt="OpenCartable" height="32" />
    </picture>
  </a>

  <!-- Nav + préférences : en ligne sur desktop, panneau déroulant du burger sur
       téléphone (un seul markup, basculé en CSS). -->
  <div class="header__menu" [id]="menuId" [class.header__menu--open]="menuOpen()">
    <!-- Nav hors du @if d'authentification : « Rechercher » est public,
         seul « Mes cours » reste réservé à la session ouverte. -->
    <nav class="header__nav" [attr.aria-label]="'header.nav' | transloco">
      <a
        class="header__nav-link"
        [routerLink]="['/', language.lang(), 'search']"
        routerLinkActive="header__nav-link--active"
      >
        {{ 'header.search' | transloco }}
      </a>
      @if (auth.isAuthenticated()) {
        <a
          class="header__nav-link"
          [routerLink]="['/', language.lang(), 'courses']"
          routerLinkActive="header__nav-link--active"
        >
          {{ 'header.myCourses' | transloco }}
        </a>
      }
    </nav>

    <div class="header__prefs">
      <div class="header__langs" role="group" [attr.aria-label]="'header.language' | transloco">
        @for (lang of langs; track lang) {
          <button
            type="button"
            class="btn btn--ghost header__lang"
            [class.header__lang--active]="language.lang() === lang"
            [attr.aria-pressed]="language.lang() === lang"
            (click)="language.switchTo(lang)"
          >
            {{ lang.toUpperCase() }}
          </button>
        }
      </div>

      <button
        type="button"
        class="btn btn--ghost header__theme"
        (click)="theme.toggle()"
        [attr.aria-label]="
          (theme.theme() === 'dark' ? 'header.themeToggleDark' : 'header.themeToggle') | transloco
        "
      >
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
          </svg>
        }
      </button>
    </div>
  </div>

  <div class="header__actions">
    @if (auth.isAuthenticated()) {
      <app-user-menu />
    } @else {
      <button
        type="button"
        class="btn btn--secondary"
        (click)="login()"
        [disabled]="auth.loggingIn()"
      >
        @if (auth.loggingIn()) {
          <app-spinner size="sm" />
        }
        {{ 'header.login' | transloco }}
      </button>
    }

    <!-- Burger (téléphone seulement, masqué en CSS au-delà) : disclosure du menu. -->
    <button
      #burger
      type="button"
      class="btn btn--ghost header__burger"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-controls]="menuId"
      [attr.aria-label]="(menuOpen() ? 'header.menuClose' : 'header.menuOpen') | transloco"
      (click)="menuOpen.set(!menuOpen())"
    >
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
        @if (menuOpen()) {
          <path d="M6 6l12 12M18 6 6 18" />
        } @else {
          <path d="M4 7h16M4 12h16M4 17h16" />
        }
      </svg>
    </button>
  </div>
</header>
