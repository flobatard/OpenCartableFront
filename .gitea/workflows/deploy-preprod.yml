# Preprod front — Build → Push registry → Deploy (pull) via docker compose.
#
# Variables Gitea (Settings → Actions → Variables) :
#   REGISTRY               → registre Docker privé (ex. registry.example.tld)
#   REGISTRY_NAMESPACE     → namespace/organisation dans le registre (ex. admin)
#   IMAGE_NAME              → nom de l'image, sans namespace ni tag (ex. opencartable-front)
#   APP_SERVER              → hôte de preprod (ex. app-05.vpn.example.tld)
#   DEPLOY_PATH              → répertoire de déploiement sur l'hôte cible
#   DEPLOY_SSH_USER          → utilisateur SSH de déploiement (optionnel, défaut "deploy")
#   PREPROD_ALLOWED_HOSTS    → valeur runtime d'ALLOWED_HOSTS (protection SSRF SSR, cf. docker-compose.preprod.yml)
#   PREPROD_TRUST_PROXY_HEADERS → optionnel, valeur runtime de TRUST_PROXY_HEADERS
#
# Secrets Gitea (Settings → Actions → Secrets) :
#   REGISTRY_USER / REGISTRY_PASSWORD → credentials du registry
#   PRIVATE_SSH_KEY                   → clé privée SSH de l'utilisateur de déploiement (PEM, multiline)
#
# Pas de secret .env ici : la config OIDC/apiUrl du front est compile-time,
# gravée dans le bundle par `npm run build` (configuration "production" par
# défaut, cf. angular.json → src/environments/environment.prod.ts) — à adapter
# au domaine réel de preprod AVANT de fusionner sur la branche `preprod`.

name: Deploy PREPROD

on:
  workflow_dispatch:
  push:
    branches:
      - preprod

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE: ${{ vars.REGISTRY_NAMESPACE }}/${{ vars.IMAGE_NAME }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
  SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'deploy' }}
  COMPOSE_FILE: docker-compose.preprod.yml

jobs:
  # ─────────────────────────────────────────────
  # Job 0a : Tests — garde du déploiement
  # ─────────────────────────────────────────────
  # Builder vitest (@angular/build:unit-test) en jsdom, pas de Chromium/Karma
  # à installer sur le runner.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Doit suivre le node:26-alpine du Dockerfile — pas de .nvmrc dans ce repo.
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --no-watch : sans ce flag le builder peut partir en watch et ne jamais rendre la main.
      - name: Run unit tests
        run: npm test -- --no-watch

  # ─────────────────────────────────────────────
  # Job 0b : Garde config — rien ne part si les variables Gitea sont incomplètes
  # ─────────────────────────────────────────────
  # En parallèle de "test" : échoue vite sans consommer de temps de build si
  # l'infra n'est pas configurée côté Gitea.
  check-vars:
    runs-on: ubuntu-latest

    steps:
      - name: Check required Gitea variables
        run: |
          for name in REGISTRY REGISTRY_NAMESPACE IMAGE_NAME APP_SERVER DEPLOY_PATH PREPROD_ALLOWED_HOSTS; do
            value="$(eval echo "\$$name")"
            [ -n "$value" ] || {
              echo "::error::La variable Gitea $name n'est pas définie (Settings → Actions → Variables)."
              exit 1
            }
          done
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          APP_SERVER: ${{ vars.APP_SERVER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PREPROD_ALLOWED_HOSTS: ${{ vars.PREPROD_ALLOWED_HOSTS }}

  # ─────────────────────────────────────────────
  # Job 1 : Build de l'image et push vers le registry
  # ─────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, check-vars]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to private registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
            docker login ${{ env.REGISTRY }} \
              --username "${{ secrets.REGISTRY_USER }}" \
              --password-stdin

      # Builder docker-container : requis pour --cache-to type=registry (le
      # builder « docker » par défaut ne sait pas exporter de cache). Créé au
      # premier run, réutilisé ensuite si le runner persiste.
      - name: Setup buildx builder
        run: |
          docker buildx create --name ci --driver docker-container --use 2>/dev/null \
            || docker buildx use ci

      # Cache de build DANS le registry (tag :buildcache ; mode=max = toutes les
      # couches, stages intermédiaires compris) : seules les couches qui changent
      # réellement sont re-poussées. Sans cache, chaque run reconstruisait des
      # digests neufs et re-poussait l'image entière — c'est ce qui faisait
      # tomber le push en timeout. Premier run après ce changement : cache
      # absent (simple warning), build et push complets ; les suivants sont
      # incrémentaux.
      #
      # Tags : "preprod" plutôt que "latest" — pour ne pas préempter le nom
      # "latest" le jour où un pipeline de prod poussera sur la même image.
      # Pas de --build-arg : le Dockerfile ne déclare aucun ARG (la config
      # est gravée depuis environment.prod.ts, cf. en-tête de ce fichier).
      - name: Build and push Docker image
        run: |
          docker buildx build \
            --cache-from "type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache" \
            --cache-to "type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache,mode=max" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE }}:preprod" \
            --push \
            .

      - name: Logout from registry
        if: always()
        run: docker logout ${{ env.REGISTRY }}

  # ─────────────────────────────────────────────
  # Job 2 : Déploiement sur le host de preprod via SSH
  # ─────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PRIVATE_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ vars.APP_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create deploy directory on target host
        run: |
          ssh -i ~/.ssh/id_deploy ${{ env.SSH_USER }}@${{ vars.APP_SERVER }} \
            "mkdir -p ${{ env.DEPLOY_PATH }}"

      - name: Upload ${{ env.COMPOSE_FILE }}
        run: |
          scp -i ~/.ssh/id_deploy ${{ env.COMPOSE_FILE }} \
            ${{ env.SSH_USER }}@${{ vars.APP_SERVER }}:${{ env.DEPLOY_PATH }}/

      - name: Pull image and restart service
        run: |
          ssh -i ~/.ssh/id_deploy ${{ env.SSH_USER }}@${{ vars.APP_SERVER }} bash -s <<'EOF'
          set -e
          cd ${{ env.DEPLOY_PATH }}

          # Consommés par l'interpolation du compose (image: ${REGISTRY}/${IMAGE}:${IMAGE_TAG}
          # + ALLOWED_HOSTS/TRUST_PROXY_HEADERS runtime, cf. docker-compose.preprod.yml).
          # Déployer par SHA plutôt que par le tag mobile "preprod" : le
          # rollback est un `up` avec l'ancien SHA.
          export REGISTRY="${{ env.REGISTRY }}"
          export IMAGE="${{ env.IMAGE }}"
          export IMAGE_TAG="${{ github.sha }}"
          export ALLOWED_HOSTS="${{ vars.PREPROD_ALLOWED_HOSTS }}"
          export TRUST_PROXY_HEADERS="${{ vars.PREPROD_TRUST_PROXY_HEADERS }}"

          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
            docker login ${{ env.REGISTRY }} \
              --username "${{ secrets.REGISTRY_USER }}" \
              --password-stdin

          docker compose -f ${{ env.COMPOSE_FILE }} pull
          docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans

          docker logout ${{ env.REGISTRY }}
          EOF

      - name: Cleanup secrets from runner
        if: always()
        run: rm -f ~/.ssh/id_deploy
