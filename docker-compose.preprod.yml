# Compose de déploiement (preprod) — l'image est PULLÉE depuis le registry,
# jamais buildée ici (cf. .gitea/workflows/deploy-preprod.yml).
#
# Pas de .env ici : la config OIDC/apiUrl du front est compile-time (gravée
# dans le bundle par la configuration Angular "preprod", cf.
# src/environments/environment.preprod.ts — renseigner ses placeholders AVANT
# de fusionner sur `preprod`). Seuls
# ALLOWED_HOSTS/TRUST_PROXY_HEADERS (protection SSRF de l'SSR, runtime) sont
# injectés, exportés par le workflow depuis les variables Gitea
# PREPROD_ALLOWED_HOSTS / PREPROD_TRUST_PROXY_HEADERS avant `docker compose up`.
services:
  front:
    image: ${REGISTRY}/${IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-}
